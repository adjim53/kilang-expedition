name: Deploy

# Every push to main: run CI, publish a Docker image to GitHub Container
# Registry, then (if configured) tell the host to redeploy and wait until the
# live site reports healthy.
#
# Repository settings → Secrets and variables → Actions:
#   secret   DEPLOY_HOOK_URL     Render / Railway / Coolify deploy-hook URL (optional)
#   variable PRODUCTION_URL      e.g. https://kilangexpedition.ng — used for the health check
#
# Runtime secrets (PAYSTACK_*, RESEND_API_KEY, TERMII_*, ADMIN_SECRET_KEY,
# NEXT_PUBLIC_APP_URL) are set on the host, never in this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.PRODUCTION_URL || 'http://localhost:3000' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release to production
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger host redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::DEPLOY_HOOK_URL not set — image ${{ needs.image.outputs.image }}:${{ github.sha }} published; redeploy it on your host."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Redeploy triggered."

      - name: Wait for healthy site
        if: vars.PRODUCTION_URL != ''
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          sleep 30
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/health" | tee /tmp/health.json | grep -q '"ok":true'; then
              echo; echo "Healthy:"; cat /tmp/health.json
              grep -q '"paystack":"live"' /tmp/health.json || echo "::warning::Paystack is not in live mode on production."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/api/health did not report healthy within 5 minutes."
          exit 1
