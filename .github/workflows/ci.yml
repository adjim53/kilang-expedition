name: CI

# Vercel deploys on its own (preview for every pull request, production for
# main). This workflow is the quality gate: make it a required status check on
# main (Settings → Branches) so nothing unchecked is merged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kilang
          POSTGRES_PASSWORD: kilang
          POSTGRES_DB: kilang
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kilang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://kilang:kilang@localhost:5432/kilang"
      DATABASE_URL_UNPOOLED: "postgresql://kilang:kilang@localhost:5432/kilang"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ADMIN_SECRET_KEY: "ci-only-secret"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Same command Vercel runs: migrations → tier seed → build.
      - name: Build (as Vercel does)
        run: npm run vercel-build

      - name: Smoke test
        run: |
          npm start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/waiver
          # Webhook must reject unsigned requests.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/webhooks/paystack -d '{}')" = "401"
          # Registration works against Postgres (no Paystack keys in CI → demo mode is off in production → 503 expected).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/register -H 'content-type: application/json' -d '{"tierId":"standard","fullName":"CI Climber","email":"ci@example.com","phone":"08030000009","nextOfKinName":"CI Kin","nextOfKinPhone":"08030000008","bloodGroup":"O+","genotype":"AA","experience":"BEGINNER","kitSize":"M","waiverAccepted":true}')
          test "$code" = "503"
